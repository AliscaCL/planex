<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>溯因 Agent · 内存根因分析（实时）</title>
<style>
:root{--primary:#1a56db;--primary-light:#e8edfb;--accent:#0e9f6e;--accent-light:#e6f7f0;
--danger:#e02424;--danger-light:#fde8e8;--warning:#d97706;--purple:#7c3aed;--purple-light:#f3e8ff;
--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;--g50:#f9fafb;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#1a1a2e;height:100vh;display:flex;align-items:center;justify-content:center;color:var(--g800);}
#chat{width:min(96vw,940px);height:min(95vh,880px);background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45);display:flex;flex-direction:column;}
#head{background:linear-gradient(135deg,#0f1b33,#1a3a6b 45%,#2563eb);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:14px;}
#head .logo{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;}
#head .h-title{font-size:16px;font-weight:800;}#head .h-sub{font-size:12px;opacity:.78;margin-top:2px;}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;}
#msgs{flex:1;overflow-y:auto;padding:22px;background:#f5f6f8;}
.row{display:flex;margin-bottom:16px;gap:10px;}.row.user{justify-content:flex-end;}
.avatar{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
.avatar.ai{background:var(--primary);color:#fff;}.avatar.me{background:var(--g700);color:#fff;}
.bubble{max-width:80%;padding:13px 16px;border-radius:14px;font-size:14px;line-height:1.7;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.row.ai .bubble{background:#fff;border:1px solid var(--g200);border-top-left-radius:4px;}
.row.user .bubble{background:var(--primary);color:#fff;border-top-right-radius:4px;}
.ans{white-space:pre-wrap;}
.step{margin:9px 0;border-radius:10px;overflow:hidden;font-size:13px;}
.step-head{display:flex;align-items:center;gap:7px;padding:6px 12px;font-weight:700;font-size:12px;}
.step.think{background:#faf7ff;border:1px solid var(--purple-light);}
.step.think .step-head{background:var(--purple-light);color:var(--purple);}
.step.action .step-head{background:#1e293b;color:#cbd5e1;}
.step.observe{background:#f4fbf7;border:1px solid var(--accent-light);}
.step.observe .step-head{background:var(--accent-light);color:var(--accent);}
.step-body{padding:8px 13px;color:var(--g700);white-space:pre-wrap;line-height:1.65;}
.think .step-body{color:var(--g500);font-size:12.5px;}
.code{background:#0f172a;color:#e2e8f0;font-family:Consolas,monospace;font-size:12.5px;padding:10px 13px;white-space:pre-wrap;}
.code .fn{color:#7dd3fc;}.code .ar{color:#fcd34d;}
.typing{display:flex;gap:4px;padding:3px 2px;}.typing span{width:7px;height:7px;border-radius:50%;background:var(--g400);animation:b 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.18s;}.typing span:nth-child(3){animation-delay:.36s;}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}
#chips{display:flex;gap:8px;flex-wrap:wrap;padding:8px 22px 4px;background:#f5f6f8;}
.chip{border:1px solid var(--primary);color:var(--primary);background:#fff;border-radius:18px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-weight:600;font-family:inherit;}
.chip:hover{background:var(--primary-light);}.chip.warn{border-color:var(--danger);color:var(--danger);}
#input{display:flex;gap:10px;padding:12px 22px 16px;background:#fff;border-top:1px solid var(--g200);align-items:flex-end;}
#ta{flex:1;resize:none;border:1.5px solid var(--g300);border-radius:12px;padding:11px 14px;font-size:14px;font-family:inherit;line-height:1.5;max-height:120px;outline:none;}
#ta:focus{border-color:var(--primary);}#ta:disabled{background:var(--g100);}
#send{background:var(--primary);color:#fff;border:none;border-radius:12px;width:46px;height:46px;font-size:19px;cursor:pointer;}
#send:disabled{background:var(--g300);cursor:not-allowed;}
::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:var(--g300);border-radius:4px;}
</style></head>
<body>
<div id="chat">
  <div id="head"><div class="logo">🛰️</div>
    <div style="flex:1"><div class="h-title">溯因 Agent · 内存根因分析</div>
      <div class="h-sub">deepagents + DeepSeek V4 &nbsp;|&nbsp; tcaiinnovation &nbsp;|&nbsp; 实时</div></div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px"><span class="dot"></span> 在线</div></div>
  <div id="msgs"></div>
  <div id="chips"></div>
  <div id="input"><textarea id="ta" rows="1" placeholder="输入消息…"></textarea><button id="send">➤</button></div>
</div>
<script>
const SC="suyin";
const session = (crypto.randomUUID?crypto.randomUUID():"s"+Math.random().toString(36).slice(2));
const msgs=document.getElementById('msgs'), chipsEl=document.getElementById('chips'),
      ta=document.getElementById('ta'), sendBtn=document.getElementById('send');
const scroll=()=>msgs.scrollTop=msgs.scrollHeight;
let es=null, busy=false;

function userBubble(t){const r=document.createElement('div');r.className='row user';
  r.innerHTML=`<div class="bubble"></div><div class="avatar me">我</div>`;
  r.querySelector('.bubble').textContent=t;msgs.appendChild(r);scroll();}
function aiRow(){const r=document.createElement('div');r.className='row ai';
  r.innerHTML=`<div class="avatar ai">溯</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(r);scroll();return r.querySelector('.bubble');}
function block(b,html){const d=document.createElement('div');d.innerHTML=html;const el=d.firstElementChild;b.appendChild(el);scroll();return el;}

function setChips(list){chipsEl.innerHTML='';list.forEach(c=>{const el=document.createElement('button');
  el.className='chip '+(c.cls||'');el.textContent=c.t;el.onclick=c.fn;chipsEl.appendChild(el);});}
function setBusy(v){busy=v;sendBtn.disabled=v;ta.disabled=v;}

function fmtArgs(a){try{const e=Object.entries(a||{});return e.length?e.map(([k,v])=>`${k}=${JSON.stringify(v)}`).join(', '):'';}catch(_){return '';}}

function send(text){
  if(busy||!text.trim())return;
  userBubble(text); ta.value=''; setChips([]); setBusy(true);
  const bubble=aiRow();
  bubble.querySelector('.typing').remove();
  let curThink=null, curThinkBody=null, curAns=null;
  const finalizeText=()=>{curThink=curThinkBody=curAns=null;};
  es=new EventSource(`/api/chat?session=${session}&message=${encodeURIComponent(text)}`);
  es.onmessage=(e)=>{
    const m=JSON.parse(e.data);
    if(m.type==='think'){
      if(!curThink){curThink=block(bubble,`<div class="step think"><div class="step-head">🧠 思考</div><div class="step-body"></div></div>`);curThinkBody=curThink.querySelector('.step-body');}
      curThinkBody.textContent+=m.text;scroll();
    }else if(m.type==='token'){
      if(!curAns){curAns=block(bubble,`<p class="ans"></p>`);}
      curAns.textContent+=m.text;scroll();
    }else if(m.type==='tool_start'){
      finalizeText();
      block(bubble,`<div class="step action"><div class="step-head">⚡ 调用工具</div><div class="code"><span class="fn">${m.name}</span>(<span class="ar">${fmtArgs(m.args)}</span>)</div></div>`);
    }else if(m.type==='tool_end'){
      finalizeText();
      const el=block(bubble,`<div class="step observe"><div class="step-head">📊 结果</div><div class="step-body"></div></div>`);
      el.querySelector('.step-body').textContent=m.output;
    }else if(m.type==='artifact'){
      finalizeText(); renderArtifact(bubble,m);
    }else if(m.type==='error'){
      finalizeText(); const el=block(bubble,`<p class="ans" style="color:#c0392b"></p>`);el.textContent='⚠ '+m.text;
    }else if(m.type==='done'){
      es.close(); setBusy(false); ta.focus();
      setChips(SUGGEST);
    }
  };
  es.onerror=()=>{es.close();setBusy(false);};
}

function renderArtifact(b,m){ /* 溯因场景无图表产物 */ }

const SUGGEST=[
  {t:"分类一下哪些能关、哪些要留",fn:()=>send("分类一下哪些进程能关、哪些必须保留")},
  {t:"⚠️ 确认清理全部旧版本残留",cls:"warn",fn:()=>send("确认，请逐个清理全部旧版本 VS Code 残留进程，并报告最新内存")},
];

sendBtn.onclick=()=>send(ta.value);
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(ta.value);}});
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';});

window.addEventListener('load',async()=>{
  await fetch(`/api/reset?session=${session}`).catch(()=>{});
  const b=aiRow();b.querySelector('.typing').remove();
  block(b,`<p class="ans">你好，我是<b>溯因 Agent</b>。把系统告警贴给我，我会自动定位根因、区分业务进程，并在你确认后安全清理。</p>`);
  ta.value="内存告警：tcaiinnovation 内存使用率 82.3%，请帮我排查根因并给出清理建议。";
  ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';
  setChips([{t:"📨 发送这条告警",fn:()=>send(ta.value)}]);
});
</script>
</body>
</html>
